                </div>
                <div className="text-[10px] text-gray-400 font-mono">
                   Auto Play ({Math.min(playStep, PREDEFINED_CHAT.length)}/{PREDEFINED_CHAT.length})
                </div>
              </div>
              
              <div className="flex-1 overflow-y-auto p-4 space-y-5 text-xs scroll-smooth" ref={chatScrollRef}>
                {/* 固定的第一条欢迎消息 */}
                <div className="flex items-start space-x-2">
                  <div className="w-7 h-7 rounded-full bg-blue-100 flex items-center justify-center shrink-0 border border-blue-200">
                    <Bot className="w-4 h-4 text-blue-600" />
                  </div>
                  <div className="bg-white border border-gray-200 rounded-lg rounded-tl-none p-3 shadow-sm text-gray-700 leading-relaxed">
                    你好！我是你的 AI 助手。我可以帮你生成接口文档、测试用例，或者解答关于 <span className="text-blue-600 font-medium">CRMInterface_BatchBusiness_Services</span> 的问题。
                  </div>
                </div>
                
                {/* 根据进度依次渲染预设对话序列 */}
                {visibleChats.map((chat, index) => (
                  <React.Fragment key={index}>
                    {/* 自动显示的用户消息 */}
                    <div className="flex items-start space-x-2 flex-row-reverse space-x-reverse animate-fadeIn">
                      <div className="w-7 h-7 rounded-full bg-orange-100 flex items-center justify-center shrink-0 border border-orange-200">
                        <span className="text-orange-600 text-xs font-bold">我</span>
                      </div>
                      <div className="bg-blue-500 text-white rounded-lg rounded-tr-none p-3 shadow-sm leading-relaxed">
                        {chat.user}
                      </div>
                    </div>

                    {/* 随之立刻渲染的 AI 回应 */}
                    <div className="flex items-start space-x-2 animate-fadeIn" style={{ animationDelay: '0.2s', animationFillMode: 'both' }}>
                      <div className="w-7 h-7 rounded-full bg-blue-100 flex items-center justify-center shrink-0 border border-blue-200 mt-1">
                        <Bot className="w-4 h-4 text-blue-600" />
                      </div>
                      {chat.ai}
                    </div>
                  </React.Fragment>
                ))}
              </div>
              
              {/* 输入区域 (无图片上传交互版本) */}
              <div className="p-3 bg-white border-t border-gray-200 shrink-0">
                <div className="relative flex items-end border border-gray-300 rounded-lg bg-gray-50 transition-all shadow-sm focus-within:ring-1 focus-within:ring-blue-500 focus-within:border-blue-500">
                  <textarea 
                    className={`w-full bg-transparent max-h-32 min-h-[44px] py-3 px-3 text-xs outline-none resize-none ${
                      playStep === 7 ? 'text-gray-700 cursor-text' : 'text-gray-500 cursor-not-allowed'
                    }`}
                    placeholder={
                      playStep === 1 ? "请在上方点击选择「batchBindIMEI」" :
                      playStep === 2 ? "请在上方点击「生成参数」" :
                      playStep === 7 ? "请直接输入..." :
                      playStep < PREDEFINED_CHAT.length ? `[自动演示联动中...] 下一步将在 5 秒后触发` : "演示完毕。"
                    }
                    rows={1}
                    disabled={playStep !== 7}
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    onKeyDown={(e) => {
                      if(e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        if(playStep === 7 && chatInput) {
                          setPlayStep(8);
                          setChatInput('');
                        }
                      }
                    }}
                  />
                  <button 
                    disabled={playStep !== 7 || !chatInput}
                    onClick={() => {
                      if(playStep === 7 && chatInput) {
                        setPlayStep(8);
                        setChatInput('');
                      }
                    }}
                    className={`p-2 m-1.5 rounded-md transition-colors shrink-0 shadow-sm flex items-center justify-center ${
                      playStep === 7 && chatInput ? 'bg-blue-500 hover:bg-blue-600 text-white cursor-pointer' : 'bg-gray-200 text-gray-400 cursor-not-allowed'
                    }`}
                  >
                    <Send className="w-3.5 h-3.5" />
                  </button>
                </div>
                <div className="text-[10px] text-gray-400 mt-2.5 text-center flex justify-center items-center">
                  AI 生成的内容可能存在不准确性，请注意甄别。
                </div>
              </div>
            </aside>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
